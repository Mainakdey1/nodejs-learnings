<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stylish Modern Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        background: linear-gradient(135deg, #667eea, #764ba2);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .card {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(15px);
        padding: 40px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        color: white;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .card:hover {
        transform: translateY(-10px);
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
    }

    h1 {
        margin-bottom: 15px;
        font-size: 28px;
    }

    p {
        margin-bottom: 25px;
        font-size: 14px;
        opacity: 0.9;
    }

    button {
        padding: 12px 25px;
        border: none;
        border-radius: 30px;
        background: white;
        color: #764ba2;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    button:hover {
        background: #764ba2;
        color: white;
        transform: scale(1.05);
    }
</style>
</head>
<body>

<div class="card">
    <h1>Welcome ✨</h1>
    <p>This is a stylish modern HTML page with smooth animations and glass effects.</p>
    <button>Get Started</button>
</div>

</body>
</html>
